# One file for local (Docker Desktop) and production (Coolify on the Vultr VM).
# No host ports are published here: on the VM, Coolify's proxy routes the public HTTPS domain to
# `frontend:80`, and Postgres stays on the private Docker network. Locally, add
# docker-compose.local.yml to publish ports on 127.0.0.1 (see README).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unify
      POSTGRES_USER: unify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unify -d unify"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://unify:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/unify
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-glm-5.3-flash}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-UNIFY SUITE <onboarding@resend.dev>}
      EMAIL_REDIRECT_TO: ${EMAIL_REDIRECT_TO:-}
      SALES_QUARTER_TARGET: ${SALES_QUARTER_TARGET:-250000}
      SALES_TARGET_CURRENCY: ${SALES_TARGET_CURRENCY:-USD}
    volumes:
      - uploads:/data/uploads  # uploaded files, outside the web root
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
